<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Fantasy Teams — one view</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="wrap">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">🏈</span>
        <div>
          <h1>My Fantasy Teams</h1>
          <div class="brand-sub">All your Sleeper leagues, one view</div>
        </div>
      </div>
      <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle dark or light theme">☀️</button>
    </header>

    <section class="controls">
      <div class="control grow">
        <label for="username">Sleeper username</label>
        <input id="username" type="text" placeholder="e.g. yourname" autocomplete="username" spellcheck="false" />
      </div>
      <div class="control">
        <label for="season">Season</label>
        <input id="season" type="number" min="2018" max="2100" />
      </div>
      <div class="control">
        <label for="week">Week</label>
        <select id="week"></select>
      </div>
      <div class="control">
        <label>&nbsp;</label>
        <button id="loadBtn" class="primary">Load</button>
      </div>
      <div class="control">
        <label>&nbsp;</label>
        <button id="demoBtn" class="ghost" title="See a sample dashboard with no login">Demo</button>
      </div>
    </section>

    <div id="summary" class="summary"></div>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="tabs" role="tablist" aria-label="Filter by result">
          <button class="result-tab active" data-result="all">All</button>
          <button class="result-tab" data-result="winning">Winning</button>
          <button class="result-tab" data-result="losing">Losing</button>
        </div>
        <select id="leagueFilter" class="league-filter" aria-label="Filter by league">
          <option value="*">All leagues</option>
        </select>
        <button id="starredToggle" class="chip-btn" title="Show only teams with starred players">★ Starred</button>
      </div>
      <div class="toolbar-right">
        <button id="expandAll" class="chip-btn">Expand all</button>
      </div>
    </div>

    <div id="status" class="status"></div>

    <main id="dashboard" class="dashboard"></main>

    <footer class="footer">
      Data: <span class="badge">Sleeper API</span> <span class="badge">ESPN scoreboard</span> ·
      Runs entirely in your browser · Player data cached 24h · Scores auto-refresh during live games.
    </footer>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
