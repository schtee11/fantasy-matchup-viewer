<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fantasy Command Center</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="wrap">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">🏈</span>
        <div>
          <h1>Fantasy Command Center</h1>
          <div class="brand-sub">Every league, game, and player — live, in one place</div>
        </div>
      </div>
      <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle dark or light theme">☀️</button>
    </header>

    <section class="controls">
      <div class="control grow">
        <label for="username">Sleeper username</label>
        <input id="username" type="text" placeholder="e.g. yourname" autocomplete="username" spellcheck="false" />
      </div>
      <div class="control">
        <label for="season">Season</label>
        <input id="season" type="number" min="2018" max="2100" />
      </div>
      <div class="control">
        <label for="week">Week</label>
        <select id="week"></select>
      </div>
      <div class="control">
        <label>&nbsp;</label>
        <button id="loadBtn" class="primary">Load</button>
      </div>
      <div class="control">
        <label>&nbsp;</label>
        <button id="demoBtn" class="ghost" title="See a live sample with no login">Demo</button>
      </div>
    </section>

    <div id="livebar" class="livebar" style="display:none">
      <div id="lbStatus" class="lb-status"></div>
      <button id="lbRefresh" class="chip-btn" title="Refresh now">↻ Refresh</button>
    </div>

    <nav id="viewnav" class="viewnav" aria-label="Views"></nav>

    <div id="status" class="status"></div>

    <main id="view" class="view"></main>

    <footer class="footer">
      Data: <span class="badge">Sleeper API</span> <span class="badge">ESPN scoreboard</span> ·
      Runs entirely in your browser · Player data cached 24h · Scores auto-refresh (~15s) during live games.
    </footer>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/render-common.js"></script>
  <script src="js/view-matchups.js"></script>
  <script src="js/view-games.js"></script>
  <script src="js/view-players.js"></script>
  <script src="js/view-insights.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
